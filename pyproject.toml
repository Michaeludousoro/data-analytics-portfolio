[project]
name = "data-analytics-portfolio"
version = "0.1.0"
description = "Five sector-based data analytics case studies: transport, health, retail, finance, marketing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # data handling
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    # analysis / stats
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    # visualisation
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "kaleido>=0.2.1",
    # NLP (project 3 review-sentiment layer)
    "transformers>=4.44",
    "torch>=2.4",
    # notebooks
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    # excel
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "xlrd>=2.0.1",
    # data acquisition / config
    "requests>=2.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter. This is the single source of truth for code style.
# Run `ruff format .` and `ruff check --fix .`, or just let pre-commit do it.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]
extend-exclude = ["*.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "SIM",  # flake8-simplify
    "PD",   # pandas-vet
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "PD901",   # allow the name `df` for a throwaway dataframe
]

[tool.ruff.lint.isort]
known-first-party = ["portfolio"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are allowed to leave expressions unassigned (that's how you display them).
"*.ipynb" = ["B018", "E402"]

[tool.ruff.format]
docstring-code-format = true
