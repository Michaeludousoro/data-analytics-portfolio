# Runs automatically on `git commit` (after you install it once with
# `pre-commit install`). Keeps every commit formatted and lint-clean so you
# never push messy code. Update the pinned versions with `pre-commit autoupdate`.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.13
    hooks:
      - id: ruff-check        # lint, and auto-fix what is safely fixable
        args: [--fix]
      - id: ruff-format       # format (black-compatible)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer          # every file ends in exactly one newline
      - id: trailing-whitespace        # strip trailing spaces
      - id: check-yaml                 # valid YAML
      - id: check-toml                 # valid TOML
      - id: check-merge-conflict       # block committing "<<<<<<<" markers
      - id: check-added-large-files    # block accidentally committing big data
        args: [--maxkb=5120]
